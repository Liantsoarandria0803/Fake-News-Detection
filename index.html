<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        textarea, input, button {
            width: 88%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input, textarea {
            border: 1px solid #ccc;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #764ba2;
            box-shadow: 0px 0px 5px rgba(118, 75, 162, 0.5);
        }
        button {
            background: #ff7eb3;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #ff4e90;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fake News Detector</h2>
        <input type="text" id="title" placeholder="Enter news title">
        <textarea id="text" placeholder="Enter news text" rows="4"></textarea>
        <button onclick="predictFakeNews()">Check News</button>
        <p id="result"></p>
    </div>
    <script>
        async function predictFakeNews() {
            const title = document.getElementById('title').value;
            const text = document.getElementById('text').value;
            const resultElement = document.getElementById('result');
            
            if (!title || !text) {
                resultElement.innerText = "Please enter both title and text.";
                return;
            }

            const response = await fetch('http://127.0.0.1:8000/predict/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, text })
            });
            console.log(response.json())
            const data = await response.json();

            resultElement.innerText = data.prediction;
        }
    </script>
</body>
</html>
